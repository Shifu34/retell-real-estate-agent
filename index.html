<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aria — Real Estate AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0F1117;
      --surface:   #1A1D27;
      --surface2:  #222636;
      --border:    rgba(255,255,255,0.08);
      --gold:      #C9A84C;
      --gold-dim:  rgba(201,168,76,0.15);
      --green:     #22C55E;
      --red:       #EF4444;
      --text:      #F1F5F9;
      --text-muted:#8892AA;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 100px; height: 100px;
    }
    .avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: var(--gold-dim);
      border: 2px solid rgba(201,168,76,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      position: relative; z-index: 2;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .avatar.speaking {
      border-color: var(--gold);
      box-shadow: 0 0 0 6px rgba(201,168,76,0.15), 0 0 30px rgba(201,168,76,0.2);
    }
    .pulse-ring {
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(201,168,76,0.3);
      animation: pulse 2.5s ease-out infinite;
      z-index: 1;
    }
    @keyframes pulse {
      0%   { transform: scale(1);    opacity: 0.5; }
      70%  { transform: scale(1.12); opacity: 0;   }
      100% { opacity: 0; }
    }

    /* ── Agent Info ── */
    .agent-name {
      font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .agent-role {
      font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;
    }
    .status-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.8rem; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 5px 14px; border-radius: 50px;
      margin-top: 4px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 5px var(--green);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.calling { background: var(--red); box-shadow: 0 0 5px var(--red); animation: blink 1s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Visualizer ── */
    .visualizer {
      display: flex; align-items: center; gap: 3px;
      height: 36px; width: 80px;
      opacity: 0; transition: opacity 0.4s;
    }
    .visualizer.active { opacity: 1; }
    .bar {
      flex: 1; background: var(--gold); border-radius: 2px;
      animation: grow 0.9s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
    .bar:nth-child(1){animation-delay:0s;   }
    .bar:nth-child(2){animation-delay:0.15s;}
    .bar:nth-child(3){animation-delay:0.3s; }
    .bar:nth-child(4){animation-delay:0.15s;}
    .bar:nth-child(5){animation-delay:0s;   }
    @keyframes grow {
      from { height: 4px;  }
      to   { height: 32px; }
    }

    /* ── Timer ── */
    .timer {
      font-size: 1.1rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--gold); letter-spacing: 0.05em;
      height: 24px; opacity: 0; transition: opacity 0.3s;
    }
    .timer.active { opacity: 1; }

    /* ── Call Button ── */
    .call-btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 1rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.25s;
      font-family: 'Inter', sans-serif;
    }
    .call-btn.idle {
      background: linear-gradient(135deg, var(--gold), #F5D27A);
      color: #0A0805;
      box-shadow: 0 4px 20px rgba(201,168,76,0.35);
    }
    .call-btn.idle:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(201,168,76,0.55); }
    .call-btn.connecting {
      background: var(--surface2); color: var(--text-muted);
      border: 1px solid var(--border); cursor: not-allowed;
    }
    .call-btn.active {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      color: #FC8181;
    }
    .call-btn.active:hover { background: rgba(239,68,68,0.2); }

    /* ── Transcript ── */
    .transcript-box {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      min-height: 100px; max-height: 220px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .transcript-box:empty::before {
      content: 'Conversation transcript will appear here...';
      color: var(--text-muted); font-size: 0.82rem; font-style: italic;
    }
    .msg {
      font-size: 0.82rem; line-height: 1.5;
      padding: 7px 11px; border-radius: 10px; max-width: 88%;
    }
    .msg.agent {
      background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.2);
      color: var(--text); align-self: flex-start;
    }
    .msg.user {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); align-self: flex-end;
    }
    .msg .sender { font-weight: 600; font-size: 0.72rem; margin-bottom: 2px; opacity: 0.7; }

    /* ── Stats row ── */
    .stats-row {
      display: flex; gap: 8px; width: 100%;
    }
    .stat-chip {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; text-align: center;
    }
    .stat-chip .val {
      font-size: 1rem; font-weight: 700; color: var(--gold); display: block;
    }
    .stat-chip .lbl {
      font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; display: block;
    }

    /* ── Transcript header ── */
    .transcript-header {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .transcript-header span { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .clear-btn {
      font-size: 0.68rem; color: var(--text-muted); background: none;
      border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px;
      font-family: inherit; transition: color 0.2s;
    }
    .clear-btn:hover { color: var(--red); }

    /* ── Keyboard hint ── */
    .kbd-hint {
      font-size: 0.7rem; color: var(--text-muted); text-align: center;
    }
    kbd {
      display: inline-block; padding: 1px 6px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; font-family: monospace; font-size: 0.75rem;
    }

    /* ── Footer ── */
    .footer-note {
      font-size: 0.72rem; color: var(--text-muted); text-align: center;
      line-height: 1.8;
    }
    .footer-note a { color: var(--gold); text-decoration: none; }

    /* ── Error toast ── */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: #1E1E2E; border: 1px solid rgba(239,68,68,0.4);
      border-left: 3px solid var(--red);
      color: var(--text); padding: 12px 20px; border-radius: 10px;
      font-size: 0.84rem; z-index: 9999;
      max-width: 90vw; text-align: center;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(10px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
  </style>
</head>
<body>

  <div class="card">

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="pulse-ring"></div>
      <div class="avatar" id="avatar">🏠</div>
    </div>

    <!-- Info -->
    <div style="text-align:center">
      <div class="agent-name">Aria</div>
      <div class="agent-role">Real Estate AI Agent · Retell AI</div>
      <div class="status-row" style="margin:10px auto 0;width:fit-content">
        <div class="dot" id="dot"></div>
        <span id="status-text">Ready</span>
      </div>
    </div>

    <!-- Visualizer + Timer -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <!-- Call Button -->
    <button class="call-btn idle" id="call-btn" onclick="handleCall()">
      <svg id="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <span id="btn-label">Start Call</span>
    </button>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-chip">
        <span class="val" id="stat-calls">—</span>
        <span class="lbl">Total Calls</span>
      </div>
      <div class="stat-chip">
        <span class="val" id="stat-avg">—</span>
        <span class="lbl">Avg Duration</span>
      </div>
      <div class="stat-chip">
        <span class="val" id="stat-last">—</span>
        <span class="lbl">Last Call</span>
      </div>
    </div>

    <!-- Transcript -->
    <div class="transcript-header">
      <span>TRANSCRIPT</span>
      <button class="clear-btn" onclick="document.getElementById('transcript').innerHTML=''" id="clear-btn">Clear</button>
    </div>
    <div class="transcript-box" id="transcript"></div>

    <!-- Keyboard hint -->
    <p class="kbd-hint">Press <kbd>Space</kbd> to start / end call</p>

    <!-- Footer -->
    <p class="footer-note">
      Powered by <a href="https://retellai.com" target="_blank">Retell AI</a><br />
      Model: <span id="model-display" style="color:var(--gold)">—</span> ·
      Voice: <span id="voice-display" style="color:var(--gold)">—</span><br />
      Agent: <span id="agent-id-display" style="font-family:monospace;font-size:0.68rem">—</span>
    </p>

  </div>

  <script type="module">
    // ── Dynamically load Retell client SDK from CDN ──────────────────────────
    let RetellWebClient;
    let client;
    let callActive = false;
    let timerInterval = null;
    let seconds = 0;

    async function loadSDK() {
      const mod = await import('https://cdn.jsdelivr.net/npm/retell-client-js-sdk@latest/+esm');
      RetellWebClient = mod.RetellWebClient;
    }

    // ── UI helpers ────────────────────────────────────────────────────────────
    const btn        = document.getElementById('call-btn');
    const btnLabel   = document.getElementById('btn-label');
    const btnIcon    = document.getElementById('btn-icon');
    const dot        = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const visualizer = document.getElementById('visualizer');
    const timerEl    = document.getElementById('timer');
    const avatar     = document.getElementById('avatar');
    const transcript = document.getElementById('transcript');

    function setIdle() {
      btn.className      = 'call-btn idle';
      btnLabel.textContent = 'Start Call';
      btnIcon.innerHTML  = phoneIconSVG();
      dot.className      = 'dot';
      statusText.textContent = 'Ready';
      visualizer.classList.remove('active');
      timerEl.classList.remove('active');
      avatar.classList.remove('speaking');
      clearInterval(timerInterval);
      seconds = 0;
      timerEl.textContent = '00:00';
    }

    function setConnecting() {
      btn.className      = 'call-btn connecting';
      btnLabel.textContent = 'Connecting...';
      btnIcon.innerHTML  = spinnerSVG();
      dot.className      = 'dot calling';
      statusText.textContent = 'Connecting...';
    }

    function setActive() {
      btn.className      = 'call-btn active';
      btnLabel.textContent = 'End Call';
      btnIcon.innerHTML  = endCallSVG();
      dot.className      = 'dot calling';
      statusText.textContent = 'Live';
      visualizer.classList.add('active');
      timerEl.classList.add('active');
      timerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2,'0');
        const s = String(seconds % 60).padStart(2,'0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);
    }

    function addMessage(role, text) {
      if (!text?.trim()) return;
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `<div class="sender">${role === 'agent' ? '🏠 Aria' : '👤 You'}</div>${text}`;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function showError(msg) {
      document.getElementById('toast')?.remove();
      const t = document.createElement('div');
      t.id = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 5000);
    }

    // ── Icons ─────────────────────────────────────────────────────────────────
    function phoneIconSVG() {
      return `<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>`;
    }
    function endCallSVG() {
      return `<path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 3.6 1.27a2 2 0 0 1 2 2c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L4.58 9.46a16 16 0 0 0 2.6 3.41"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>`;
    }
    function spinnerSVG() {
      return `<path d="M21 12a9 9 0 1 1-6.219-8.56" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.7s" repeatCount="indefinite"/></path>`;
    }

    // ── Main call handler ──────────────────────────────────────────────────────
    window.handleCall = async function() {
      if (callActive) {
        // End call
        try { await client?.stopCall(); } catch(e) {}
        callActive = false;
        client = null;
        setIdle();
        return;
      }

      // Start call
      setConnecting();
      try {
        if (!RetellWebClient) await loadSDK();

        // 1. Get access token from our backend
        const res = await fetch('/create-web-call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `Server error ${res.status}`);
        }
        const { access_token } = await res.json();

        // 2. Start Retell web call
        client = new RetellWebClient();

        client.on('call_started', () => {
          callActive = true;
          setActive();
          avatar.classList.add('speaking');
        });

        client.on('call_ended', () => {
          callActive = false;
          client = null;
          setIdle();
        });

        client.on('error', (err) => {
          console.error(err);
          callActive = false;
          client = null;
          setIdle();
          showError('Call error: ' + (err?.message || 'Unknown'));
        });

        client.on('update', (update) => {
          // Live transcript updates
          if (update.transcript) {
            transcript.innerHTML = '';
            update.transcript.forEach(turn => {
              addMessage(turn.role === 'agent' ? 'agent' : 'user', turn.content);
            });
          }
          // Speaking indicator
          if (update.turntaking === 'agent_turn') {
            avatar.classList.add('speaking');
          } else if (update.turntaking === 'user_turn') {
            avatar.classList.remove('speaking');
          }
        });

        await client.startCall({ accessToken: access_token });

      } catch (err) {
        console.error(err);
        setIdle();
        if (err?.name === 'NotAllowedError') {
          showError('Microphone permission denied. Please allow mic access and try again.');
        } else {
          showError(err.message || 'Failed to start call. Check the server is running.');
        }
      }
    };

    // ── Space key shortcut ────────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        if (!btn.classList.contains('connecting')) handleCall();
      }
    });

    // ── Load agent info on page load ─────────────────────────────────────────
    fetch('/agent-info')
      .then(r => r.json())
      .then(d => {
        if (d.agent_id)  document.getElementById('agent-id-display').textContent = d.agent_id;
        if (d.model)     document.getElementById('model-display').textContent = d.model;
        if (d.voice_id)  document.getElementById('voice-display').textContent = d.voice_id;
      })
      .catch(() => {});

    // ── Load call stats ───────────────────────────────────────────────────────
    async function refreshStats() {
      try {
        const s = await fetch('/stats').then(r => r.json());
        document.getElementById('stat-calls').textContent = s.totalCalls ?? 0;
        document.getElementById('stat-avg').textContent =
          s.avgDurationSec > 0 ? `${s.avgDurationSec}s` : '—';
        document.getElementById('stat-last').textContent = s.lastCall
          ? new Date(s.lastCall).toLocaleDateString()
          : 'None';
      } catch { /* stats unavailable */ }
    }
    refreshStats();
  </script>
</body>
</html>
